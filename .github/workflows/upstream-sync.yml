name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outdated: ${{ steps.diff.outputs.outdated }}
      current: ${{ steps.diff.outputs.current }}
      latest: ${{ steps.diff.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts

      - name: Report upstream diff
        id: diff
        run: npm run diff:upstream | tee upstream-report.txt

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-report
          path: upstream-report.txt

  report:
    needs: check-upstream
    if: needs.check-upstream.outputs.outdated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Treat the build's report as data; no checkout or package execution.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-report
      - name: Bound report size
        run: test "$(wc -c < upstream-report.txt)" -le 50000
      - name: Ensure upstream label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create upstream \
            --description "Upstream design-system sync needed" \
            --color "0E8A16" \
            --force

      - name: Create or update sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.check-upstream.outputs.current }}
          LATEST: ${{ needs.check-upstream.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$CURRENT" =~ ^[a-f0-9]{40}$ && "$LATEST" =~ ^[a-f0-9]{40}$ ]] || exit 1

          SHORT_CURRENT="${CURRENT:0:7}"
          SHORT_LATEST="${LATEST:0:7}"
          TITLE="Upstream sync: digital-go-jp/design-system-example-components-react (${SHORT_CURRENT} → ${SHORT_LATEST})"

          BODY_FILE=$(mktemp)
          {
            echo "## Upstream update detected"
            echo
            echo "Pinned submodule commit is behind the latest upstream default branch."
            echo
            echo "| | SHA |"
            echo "|---|---|"
            echo "| Current (pinned) | \`${CURRENT}\` |"
            echo "| Latest | [\`${LATEST}\`](https://github.com/digital-go-jp/design-system-example-components-react/commit/${LATEST}) |"
            echo
            echo "Workflow run: ${RUN_URL}"
            echo
            echo "## Diff report"
            echo
            echo '```'
            cat upstream-report.txt
            echo '```'
            echo
            echo "## Next steps"
            echo
            echo "- [ ] Update the upstream submodule to \`${LATEST}\`"
            echo "- [ ] Review affected local components / registry items"
            echo "- [ ] Run the listed parity / a11y / visual tests"
            echo "- [ ] Check whether \`THIRD_PARTY_LICENSES.md\` needs updates"
            echo "- [ ] Open a PR and close this issue"
          } > "$BODY_FILE"

          EXISTING=$(
            gh issue list \
              --label upstream \
              --state open \
              --json number,title \
              --jq '.[] | select(.title | startswith("Upstream sync: digital-go-jp/design-system-example-components-react")) | .number' \
            | head -n 1
          )

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            gh issue comment "$EXISTING" --body "Upstream sync check re-ran and refreshed this issue. Run: ${RUN_URL}"
            echo "Updated issue #${EXISTING}"
          else
            URL=$(gh issue create --title "$TITLE" --label upstream --body-file "$BODY_FILE")
            echo "Created issue: ${URL}"
          fi
