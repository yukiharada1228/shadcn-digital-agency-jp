name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify upstream submodule
        run: npm run check:upstream

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Demo build
        run: npm run demo:build

      - name: Unit + a11y tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser a11y tests
        run: npm run test:browser-a11y

      # upstream と自前実装を同じブラウザで描き比べる spec のみ。ストア済み
      # スナップショット（storybook-parity）は macOS で撮ったもので、Linux では
      # フォント描画が異なるため CI からは除外している。
      - name: Upstream source parity tests
        run: npm run test:visual:parity

      - name: Theme is up to date
        run: npm run check:theme

      - name: Registry is up to date
        run: npm run registry:test

      - name: License / attribution check
        run: npm run license:check

  workflow-security:
    name: Automation Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test .github/scripts/*.test.cjs

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [ci, workflow-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every CI job to succeed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const { requireCiSuccess } = require('./.github/scripts/dependency-automation.cjs');
            requireCiSuccess(JSON.parse(process.env.CI_NEEDS));
