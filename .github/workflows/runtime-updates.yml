name: Runtime Updates
on:
  schedule:
    - cron: "13 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover updates without creating or changing PRs
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: runtime-updates
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository_owner == 'yukiharada1228' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, npm]
        channel: [current, next]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Discover official Node.js and npm releases
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME: ${{ matrix.runtime }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          args=()
          if [ "$CHANNEL" = next ]; then args+=(--upgrade); fi
          node .github/scripts/runtime-versions.cjs plan --runtime "$RUNTIME" "${args[@]}" --output runtime-plan.json
      - name: Describe the proposed update
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('runtime-plan.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${plan.runtime} (${plan.channel}): ${plan.version} — ${Object.keys(plan.files).length} changed files\n`);
          JS
      - name: Create repository-scoped runtime update token
        if: steps.plan.outputs.changed == 'true' && (github.event_name == 'schedule' || !inputs.dry_run)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PATCH_BOT_APP_ID }}
          private-key: ${{ secrets.PATCH_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open a reviewable runtime PR with normal CI
        if: steps.plan.outputs.changed == 'true' && (github.event_name == 'schedule' || !inputs.dry_run)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUNTIME_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs = require('node:fs');
            const { publish } = require('./.github/scripts/runtime-pull-request.cjs');
            await publish({ github, context, core, bot: process.env.RUNTIME_BOT,
              plan: JSON.parse(fs.readFileSync('runtime-plan.json', 'utf8')) });
