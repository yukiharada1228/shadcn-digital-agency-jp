version: 2

updates:
  # The upstream submodule is managed by the Upstream Sync workflow.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Keep Node types aligned with the Node 22 runtime used in all workflows.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Remove this temporary exclusion when typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0 <8.0.0"
    groups:
      # React plugin major releases can require a matching Vite major release.
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # ESLint and its plugins must agree on supported peer dependency versions.
      eslint-toolchain:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-plugin-react-hooks"
          - "typescript-eslint"
          - "globals"
      # Other major updates remain separate for individual review.
      npm-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
