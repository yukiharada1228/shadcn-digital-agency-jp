version: 2

updates:
  # The upstream submodule is managed by the Upstream Sync workflow.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # React plugin major releases can require a matching Vite major release.
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # ESLint and its plugins must agree on supported peer dependency versions.
      eslint-toolchain:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "eslint-plugin-react-hooks"
          - "typescript-eslint"
          - "globals"
      # Other major updates remain separate for individual review.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
