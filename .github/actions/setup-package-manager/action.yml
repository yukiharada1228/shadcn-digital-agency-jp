name: Set up a reviewed package manager
description: Install the hash-pinned npm distribution from the runtime manifest
inputs:
  manager:
    description: Package manager to install
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PACKAGE_MANAGER: ${{ inputs.manager }}
      run: node .github/scripts/package-managers.cjs "$PACKAGE_MANAGER"
